[workspace]
resolver = "3"
members = ["crates/glint", "crates/glint-update", "crates/ym-api", "crates/ym-audio"]

[workspace.package]
version = "0.9.2"
edition = "2024"
license = "GPL-3.0-only"
rust-version = "1.100"
authors = ["Glint contributors"]
repository = "https://github.com/orphytype/glint"

[workspace.dependencies]
# RUNE is pre-release: pin a rev of `dev` (it is never rewritten). Same rev for every RUNE crate.
rune = { git = "https://github.com/anomalyco/rune", rev = "8f7e1c420e130dde0f9ede289b5680df1aade343" }
rune-fx = { git = "https://github.com/anomalyco/rune", rev = "8f7e1c420e130dde0f9ede289b5680df1aade343" }
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "8f7e1c420e130dde0f9ede289b5680df1aade343" }
rune-motion = { git = "https://github.com/anomalyco/rune", rev = "8f7e1c420e130dde0f9ede289b5680df1aade343" }
bytemuck = { version = "1.25", features = ["derive"] }
reqwest = { version = "0.13", default-features = false }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
cloned_instead_of_copied = "warn"
dbg_macro = "warn"
enum_glob_use = "warn"
flat_map_option = "warn"
implicit_clone = "warn"
inefficient_to_string = "warn"
large_enum_variant = "warn"
manual_let_else = "warn"
match_same_arms = "warn"
redundant_clone = "warn"
redundant_closure_for_method_calls = "warn"
trivially_copy_pass_by_ref = "warn"
undocumented_unsafe_blocks = "warn"
uninlined_format_args = "warn"
unnecessary_wraps = "warn"
unwrap_used = "warn"
wildcard_imports = "warn"

# RUNE builds against patched copies of these crates (its own `[patch.crates-io]` does not reach an
# app that depends on it), so take the same copies from the same pinned rev.
[patch.crates-io]
wgpu-hal = { git = "https://github.com/anomalyco/rune", rev = "8f7e1c420e130dde0f9ede289b5680df1aade343" }
winit = { git = "https://github.com/anomalyco/rune", rev = "8f7e1c420e130dde0f9ede289b5680df1aade343" }
sctk-adwaita = { git = "https://github.com/anomalyco/rune", rev = "8f7e1c420e130dde0f9ede289b5680df1aade343" }
parley_engine = { git = "https://github.com/anomalyco/rune", rev = "8f7e1c420e130dde0f9ede289b5680df1aade343" }
accesskit_windows = { git = "https://github.com/anomalyco/rune", rev = "8f7e1c420e130dde0f9ede289b5680df1aade343" }
accesskit_macos = { git = "https://github.com/anomalyco/rune", rev = "8f7e1c420e130dde0f9ede289b5680df1aade343" }

# Dependencies are compiled with light optimisation even in dev builds: wgpu, naga and the
# image codecs are unusably slow at opt-level 0, and they rarely change.
[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = false

# Real-time DSP is unusable (and glitchy) unoptimised.
[profile.dev.package.ym-audio]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
incremental = true
strip = "debuginfo"
