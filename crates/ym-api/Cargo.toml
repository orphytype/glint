[package]
name = "ym-api"
description = "Async client for the unofficial Yandex Music API: library, search, Wave, lyrics and signed stream URLs."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
reqwest = { workspace = true, features = ["json", "form", "query", "gzip", "charset", "system-proxy"] }
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
md-5 = "0.11"
hmac = "0.13"
sha2.workspace = true
base64 = "0.23"

# TLS on Windows: the OS's own (SChannel), so no C toolchain is needed for the crypto.
[target.'cfg(windows)'.dependencies]
reqwest = { workspace = true, features = ["native-tls"] }

# Everywhere else: rustls with ring, checked against the system's certificates. Not OpenSSL, whose
# library differs from one Linux to the next (1.1 or 3, and named differently), which would tie a
# build to the distribution it was made on.
[target.'cfg(not(windows))'.dependencies]
reqwest = { workspace = true, features = ["rustls-no-provider"] }
rustls.workspace = true
