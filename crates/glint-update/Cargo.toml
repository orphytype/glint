[package]
name = "glint-update"
description = "Looks for a newer Glint among the GitHub releases, downloads it and puts it in place."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
reqwest = { workspace = true, features = ["json", "system-proxy"] }
serde.workspace = true
thiserror.workspace = true
sha2.workspace = true

# TLS on Windows: the OS's own (SChannel), as in ym-api.
[target.'cfg(windows)'.dependencies]
reqwest = { workspace = true, features = ["native-tls"] }
zip = { version = "9", default-features = false, features = ["deflate"] }

# Everywhere else: rustls with ring, checked against the system's certificates, as in ym-api.
[target.'cfg(not(windows))'.dependencies]
reqwest = { workspace = true, features = ["rustls-no-provider"] }
rustls.workspace = true

