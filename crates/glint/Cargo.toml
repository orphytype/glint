[package]
name = "glint"
description = "Неофициальный клиент Яндекс Музыки для Windows и Linux на Rust."
repository.workspace = true
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "glint"
path = "src/main.rs"

[build-dependencies]
# Embeds the icon and the version details in glint.exe (see build.rs). Without its default
# `toml` feature it reads nothing from Cargo.toml and adds one tiny crate to the build.
winresource = { version = "0.1", default-features = false }

[dependencies]
rune.workspace = true
rune-fx.workspace = true
rune-motion.workspace = true
rune-kit = { workspace = true, default-features = false }
ym-api = { path = "../ym-api" }
ym-audio = { path = "../ym-audio" }
glint-update = { path = "../glint-update" }
bytemuck.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
wgpu = { version = "30", default-features = false, features = ["std", "parking_lot", "wgsl"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
wgpu = { version = "30", default-features = false, features = ["vulkan", "dx12"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_System_Console", "Win32_System_Registry", "Win32_System_SystemInformation"] }
# The media keys and the "now playing" card (System Media Transport Controls) are WinRT. The
# crate is already in the build (cpal, accesskit and wgpu use it), so this adds only features.
windows = { version = "0.62", features = ["Foundation", "Media", "Storage_Streams", "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Threading", "Win32_System_WinRT", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
# MPRIS (the media keys and the desktop's "now playing" card) and the portal's colour scheme, over
# the session bus. RUNE's tray already brings zbus 6 in with these features, so this adds nothing.
zbus = { version = "6", default-features = false, features = ["tokio", "proxy", "service"] }

[features]
# RUNE's headless tools (`--snap`, `--scene`, `--script` and the rest), which the scenes and the
# screenshot checks use. Release packages are built without them (`--no-default-features`).
default = ["tooling"]
tooling = ["rune/tooling"]
# Per-frame timings for measuring (RUNE_FRAME_LOG=FILE); never in a shipped build.
profile = ["rune/frame-profile"]

# ---- Linux packages (scripts/dist-linux.sh) ---------------------------------------------------
# Paths are relative to this crate; `target/release/glint` means the workspace's build.

[package.metadata.deb]
name = "glint"
maintainer = "Glint contributors"
copyright = "Glint contributors"
section = "sound"
priority = "optional"
extended-description = "Неофициальный клиент Яндекс Музыки для Windows и Linux на Rust. Unofficial Yandex Music client for Windows and Linux, written in Rust."
# `$auto` finds the libraries the binary links (ALSA, fontconfig, Wayland, glibc); the rest are
# opened at run time: the Vulkan loader for drawing, xkbcommon for the keyboard, X11 under X.
depends = "$auto, libvulkan1, libxkbcommon0"
recommends = "mesa-vulkan-drivers, libxkbcommon-x11-0, libx11-6, libx11-xcb1, libxcursor1, libxrandr2, libxi6"
assets = [
    ["target/release/glint", "usr/bin/", "755"],
    ["../../LICENSE", "usr/share/doc/glint/LICENSE", "644"],
    ["../../packaging/linux/glint.desktop", "usr/share/applications/", "644"],
    ["../../packaging/linux/glint.metainfo.xml", "usr/share/metainfo/", "644"],
    ["../../packaging/linux/icons/256.png", "usr/share/icons/hicolor/256x256/apps/glint.png", "644"],
    ["../../packaging/linux/icons/128.png", "usr/share/icons/hicolor/128x128/apps/glint.png", "644"],
    ["../../packaging/linux/icons/64.png", "usr/share/icons/hicolor/64x64/apps/glint.png", "644"],
    ["../../packaging/linux/icons/48.png", "usr/share/icons/hicolor/48x48/apps/glint.png", "644"],
    ["../../packaging/linux/icons/32.png", "usr/share/icons/hicolor/32x32/apps/glint.png", "644"],
    ["../../README.md", "usr/share/doc/glint/README.md", "644"],
    ["../../NOTICE.md", "usr/share/doc/glint/NOTICE.md", "644"],
]

[package.metadata.generate-rpm]
name = "glint"
summary = "Неофициальный клиент Яндекс Музыки"
assets = [
    { source = "target/release/glint", dest = "/usr/bin/glint", mode = "755" },
    { source = "../../LICENSE", dest = "/usr/share/doc/glint/LICENSE", mode = "644", doc = true },
    { source = "../../packaging/linux/glint.desktop", dest = "/usr/share/applications/glint.desktop", mode = "644" },
    { source = "../../packaging/linux/glint.metainfo.xml", dest = "/usr/share/metainfo/glint.metainfo.xml", mode = "644" },
    { source = "../../packaging/linux/icons/256.png", dest = "/usr/share/icons/hicolor/256x256/apps/glint.png", mode = "644" },
    { source = "../../packaging/linux/icons/128.png", dest = "/usr/share/icons/hicolor/128x128/apps/glint.png", mode = "644" },
    { source = "../../packaging/linux/icons/64.png", dest = "/usr/share/icons/hicolor/64x64/apps/glint.png", mode = "644" },
    { source = "../../packaging/linux/icons/48.png", dest = "/usr/share/icons/hicolor/48x48/apps/glint.png", mode = "644" },
    { source = "../../packaging/linux/icons/32.png", dest = "/usr/share/icons/hicolor/32x32/apps/glint.png", mode = "644" },
    { source = "../../README.md", dest = "/usr/share/doc/glint/README.md", mode = "644", doc = true },
    { source = "../../NOTICE.md", dest = "/usr/share/doc/glint/NOTICE.md", mode = "644", doc = true },
]
# The linked libraries are found from the binary; what it opens at run time is recommended, since
# the package names differ between Fedora and openSUSE.
auto-req = "auto"

[package.metadata.generate-rpm.recommends]
"vulkan-loader" = "*"
"libxkbcommon" = "*"
"libxkbcommon-x11" = "*"
